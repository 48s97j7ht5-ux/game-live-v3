name: Compose sprite

on:
  workflow_dispatch:
  push:
    paths:
      - "templates/parts/**"
      - "characters/**/assemble.json"
      - "scripts/compose.py"

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/compose.py characters/test/assemble.json
      - uses: actions/upload-artifact@v4
        with:
          name: composed-sprite
          path: output/test/composed.png
        if: hashFiles('templates/parts/body_base.png') != ''
