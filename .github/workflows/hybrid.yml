name: Hybrid pixel experiment
on:
  pull_request:
    paths: ['pixel-editor/hybrid/**', 'scripts/hybrid*', 'tests/hybrid.cjs', '.github/workflows/hybrid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hybrid-deps" --no-audit --no-fund playwright@1.62.1 pngjs@7.0.0
          node "$RUNNER_TEMP/hybrid-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify composition and mobile export
        run: NODE_PATH="$RUNNER_TEMP/hybrid-deps/node_modules" node tests/hybrid.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-mobile
          path: test-results/hybrid-*.png
