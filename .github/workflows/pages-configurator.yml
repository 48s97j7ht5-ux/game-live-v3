name: Pages — configurator

on:
  push:
    branches: [main]
    paths:
      - "configurator/**"
      - ".github/workflows/pages-configurator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-configurator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: configurator
      - id: deployment
        uses: actions/deploy-pages@v4
