name: Pages — site

on:
  push:
    branches: [main]
    paths:
      - "configurator/**"
      - "compositor/**"
      - "face-compositor/**"
      - "site/**"
      - ".github/workflows/pages-configurator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages bundle
        run: |
          mkdir -p _site
          cp -r configurator _site/configurator
          cp -r compositor _site/compositor
          cp -r face-compositor _site/face-compositor
          cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
