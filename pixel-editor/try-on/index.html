function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Не удалось прочитать PNG'));im.src=src})}
function blank(){const c=document.createElement('canvas');c.width=96;c.height=256;return c}
function recolor(image,hue){const c=blank(),cx=c.getContext('2d');cx.drawImage(image,0,0);const im=cx.getImageData(0,0,96,256),p=im.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];if(!p[i+3]||!(r>g*1.2+8&&b>g*1.3+10))continue;const max=Math.max(r,g,b)/255,min=Math.min(r,g,b)/255,light=(max+min)/2;const sat=max===min?0:(max-min)/(1-Math.abs(2*light-1));const chroma=(1-Math.abs(2*light-1))*sat,x=chroma*(1-Math.abs((hue/60)%2-1)),m=light-chroma/2;let rgb=hue<60?[chroma,x,0]:hue<120?[x,chroma,0]:hue<180?[0,chroma,x]:hue<240?[0,x,chroma]:hue<300?[x,0,chroma]:[chroma,0,x];for(let j=0;j<3;j++)p[i+j]=Math.round((rgb[j]+m)*255)}cx.putImageData(im,0,0);return c}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({selected:items[selected].id,custom}))}catch{message('Образ работает; браузер не смог сохранить его на этом устройстве.',true)}}
function draw(){if(!ready)return;ctx.clearRect(0,0,96,256);ctx.imageSmoothingEnabled=false;ctx.drawImage(base,0,0);if(items[selected].image)ctx.drawImage(items[selected].image,0,0);$('#name').textContent=items[selected].name;$('#counter').textContent=`${selected+1} / ${items.length}`;canvas.setAttribute('aria-label',`Катя. ${items[selected].name}`);$('#dots').replaceChildren(...items.map((item,i)=>{const b=document.createElement('button');b.className='dot';b.style.setProperty('--swatch',item.swatch||'#c9c1d3');b.setAttribute('aria-label',item.name);b.setAttribute('aria-pressed',i===selected?'true':'false');b.onclick=()=>choose(i);return b}));persist()}
function choose(i){if(!ready)return;selected=(i+items.length)%items.length;message('');draw()}
$('#prev').onclick=()=>choose(selected-1);$('#next').onclick=()=>choose(selected+1);$('#bare').onclick=()=>choose(0);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();choose(selected+(e.key==='ArrowLeft'?-1:1))}});
function fit(){const stage=$('.stage'),zoom=Math.max(1,Math.min(3,Math.floor((stage.clientHeight-30)/256),Math.floor((stage.clientWidth-112)/96)));$('.avatar').style.setProperty('--zoom',zoom)}new ResizeObserver(fit).observe($('.stage'));
$('#add').onclick=()=>$('#upload').click();
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Не удалось открыть файл'));r.readAsDataURL(file)})}
$('#upload').onchange=async e=>{const files=[...e.target.files];e.target.value='';let added=0,errors=[];$('#add').disabled=true;for(const file of files){try{if(custom.length>=12)throw new Error('Можно добавить до 12 своих причёсок');if(file.size>2*1024*1024)throw new Error('PNG должен быть меньше 2 МБ');const signature=new Uint8Array(await file.slice(0,8).arrayBuffer());if(signature.join(',')!=='137,80,78,71,13,10,26,10')throw new Error('Нужен файл PNG');const data=await readFile(file),image=await loadImage(data);if(image.naturalWidth!==96||image.naturalHeight!==256)throw new Error(`Размер ${image.naturalWidth} × ${image.naturalHeight}; нужен 96 × 256`);const c=blank(),cx=c.getContext('2d');cx.drawImage(image,0,0);const pixels=cx.getImageData(0,0,96,256).data;let transparent=false;for(let i=3;i<pixels.length;i+=4)if(pixels[i]===0){transparent=true;break}if(!transparent)throw new Error('Нужен слой волос с прозрачным фоном');const item={id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:file.name.replace(/\.png$/i,'').slice(0,70),data:c.toDataURL('image/png')};custom.push(item);items.push({...item,image});selected=items.length-1;added++}catch(err){errors.push(`${file.name}: ${err.message}`)}}$('#add').disabled=false;draw();message(errors.length?errors.join(' · '):`Добавлено: ${added}`,!!errors.length)};
$('#save').onclick=()=>{canvas.toBlob(blob=>{if(!blob){message('Не удалось сохранить PNG',true);return}if(exportUrl)URL.revokeObjectURL(exportUrl);exportUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=exportUrl;a.download='kat-'+items[selected].id+'.png';document.body.appendChild(a);a.click();a.remove();message('PNG 96 × 256 подготовлен к сохранению.')},'image/png')};
(async()=>{try{const hair=await loadImage(HAIR);base=await loadImage(BASE);items=[{id:'none',name:'Без волос',image:null,swatch:'#a7937d'},{id:'bob-purple',name:'Каре · фиолетовая прядь',image:hair,swatch:'#a45cdf'},{id:'bob-red',name:'Каре · красная прядь',image:recolor(hair,350),swatch:'#d54f68'},{id:'bob-teal',name:'Каре · бирюзовая прядь',image:recolor(hair,175),swatch:'#56c5bd'}];let cached;try{cached=JSON.parse(localStorage.getItem(storageKey)||'null')}catch{}if(cached&&Array.isArray(cached.custom)){for(const item of cached.custom.slice(0,12)){try{if(typeof item.data!=='string'||!item.data.startsWith('data:image/png;base64,')||item.data.length>2800000||typeof item.name!=='string'||typeof item.id!=='string')continue;const image=await loadImage(item.data);if(image.naturalWidth!==96||image.naturalHeight!==256)continue;custom.push(item);items.push({...item,image})}catch{}}const idx=items.findIndex(x=>x.id===cached.selected);if(idx>=0)selected=idx}ready=true;document.querySelectorAll('button[disabled]').forEach(b=>b.disabled=false);draw();fit()}catch(err){$('#name').textContent='Не удалось загрузить подложку';message(err.message,true)}})();
</script></body></html>
