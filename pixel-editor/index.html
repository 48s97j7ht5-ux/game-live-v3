<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Lab 400</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#111}body{overflow:hidden}</style></head><body><iframe id="lab" src="./pixel-lab-v4.html?v=grid2"></iframe><script>const frame=document.getElementById('lab');frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument,l=d.getElementById('loupe');if(!l)return;const old=w.updateLoupe;function renderCellGrid(){const s=+d.getElementById('loupeSize').value,cell=15,src=document.createElement('canvas');src.width=s;src.height=s;const sx=src.getContext('2d');sx.imageSmoothingEnabled=false;sx.drawImage(l,0,0,s,s);l.width=s*cell;l.height=s*cell;l.style.width=Math.min(s*cell,315)+'px';l.style.height=Math.min(s*cell,315)+'px';const ctx=l.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,l.width,l.height);ctx.drawImage(src,0,0,s,s,0,0,l.width,l.height);if(d.getElementById('loupeGrid')?.checked){ctx.strokeStyle='rgba(20,20,20,.72)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=s;i++){const q=i*cell+.5;ctx.moveTo(q,0);ctx.lineTo(q,s*cell);ctx.moveTo(0,q);ctx.lineTo(s*cell,q)}ctx.stroke()}const h=Math.floor(s/2);ctx.strokeStyle='#00ffff';ctx.lineWidth=2;ctx.strokeRect(h*cell+1,h*cell+1,cell-2,cell-2)}if(typeof old==='function'){w.updateLoupe=function(...a){const r=old.apply(this,a);renderCellGrid();return r}}['loupeGrid','loupeSize'].forEach(id=>d.getElementById(id)?.addEventListener('change',()=>setTimeout(()=>w.updateLoupe?.(),0)));setTimeout(()=>w.updateLoupe?.(),80)};</script></body></html>
