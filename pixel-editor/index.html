<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Lab 400</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#111}body{overflow:hidden}</style></head><body><iframe id="lab" src="./pixel-lab-v4.html?v=solo1"></iframe><script>const frame=document.getElementById('lab');frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument,l=d.getElementById('loupe');if(!l)return;

// Strong, physical pixel grid for iPhone/Safari.
function strongGrid(){const cb=d.getElementById('loupeGrid');if(!cb||!cb.checked)return;const s=+d.getElementById('loupeSize').value,ctx=l.getContext('2d');ctx.save();ctx.strokeStyle='rgba(18,18,18,.52)';ctx.lineWidth=.09;for(let i=1;i<s;i++){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,s);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(s,i);ctx.stroke()}const h=Math.floor(s/2);ctx.strokeStyle='rgba(0,255,255,.95)';ctx.lineWidth=.10;ctx.strokeRect(h+.05,h+.05,.9,.9);ctx.restore()}
const oldLoupe=w.updateLoupe;if(typeof oldLoupe==='function'){w.updateLoupe=function(...a){const r=oldLoupe.apply(this,a);strongGrid();return r}}
['loupeGrid','loupeSize'].forEach(id=>{const el=d.getElementById(id);if(el)el.addEventListener('change',()=>setTimeout(strongGrid,0))});l.addEventListener('pointerup',()=>setTimeout(strongGrid,0));

// Layer view modes. This script runs in the same page/realm, so it can work with V4's layer stack through compose().
const script=d.createElement('script');script.textContent=`(()=>{let viewMode='composite';const layerBox=document.getElementById('layers');if(!layerBox)return;const card=layerBox.closest('.card');const headRow=card.querySelector('.row');const viewRow=document.createElement('div');viewRow.className='row';viewRow.innerHTML='<button id="viewComposite" class="active">Composite</button><button id="viewSolo">Solo layer</button><button id="viewUnderlay">Active + underlay</button>';headRow.insertAdjacentElement('afterend',viewRow);const st=document.createElement('style');st.textContent='#viewComposite.active,#viewSolo.active,#viewUnderlay.active{outline:2px solid #8cf;background:#263747}';document.head.appendChild(st);function mark(){['viewComposite','viewSolo','viewUnderlay'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(viewMode==='solo'?'viewSolo':viewMode==='underlay'?'viewUnderlay':'viewComposite').classList.add('active')}compose=function(){pc.clearRect(0,0,W,H);if(viewMode==='solo'){const l=layers[active];if(l){pc.save();pc.globalAlpha=l.opacity;pc.drawImage(l.canvas,0,0);pc.restore()}}else if(viewMode==='underlay'){for(let i=0;i<layers.length;i++){const l=layers[i];if(i===active||!l.visible)continue;pc.save();pc.globalAlpha=Math.min(.20,l.opacity*.20);pc.drawImage(l.canvas,0,0);pc.restore()}const l=layers[active];if(l){pc.save();pc.globalAlpha=l.opacity;pc.drawImage(l.canvas,0,0);pc.restore()}}else{for(const l of layers){if(!l.visible)continue;pc.save();pc.globalAlpha=l.opacity;pc.drawImage(l.canvas,0,0);pc.restore()}}updateLoupe(false)};function setMode(m){viewMode=m;mark();compose();const s=document.getElementById('status');if(s)s.textContent=m==='solo'?'Solo: только активный слой':m==='underlay'?'Active + underlay: активный слой яркий, остальные 20%':'Composite: все видимые слои'}document.getElementById('viewComposite').onclick=()=>setMode('composite');document.getElementById('viewSolo').onclick=()=>setMode('solo');document.getElementById('viewUnderlay').onclick=()=>setMode('underlay');mark();})();`;d.body.appendChild(script);

setTimeout(()=>{if(typeof w.updateLoupe==='function')w.updateLoupe();else strongGrid()},50)};</script></body></html>
