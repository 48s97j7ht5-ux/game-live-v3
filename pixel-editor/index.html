<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Lab 400</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#111}body{overflow:hidden}</style></head><body><iframe id="lab" src="./pixel-lab-v2.html"></iframe><script>const frame=document.getElementById('lab');frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument;async function loadBundledKat(){try{const b64=(await fetch('./assets/kat-v1_1.b64.txt?v=2')).then(r=>r.text()),raw=atob((await b64).trim()),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'})),im=new Image();im.onload=()=>{const c=d.getElementById('paint'),ctx=c.getContext('2d');if(typeof w.saveUndo==='function')w.saveUndo();ctx.clearRect(0,0,135,400);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,0,0,135,400);URL.revokeObjectURL(url);if(typeof w.autosave==='function')w.autosave();const s=d.getElementById('status');if(s)s.textContent='Kat V1.1 loaded · 135×400'};im.src=url}catch(e){const s=d.getElementById('status');if(s)s.textContent='Kat load error: '+e.message}}const b=d.getElementById('loadKat');if(b)b.onclick=loadBundledKat;if(new URLSearchParams(location.search).get('kat')==='1')loadBundledKat()};</script></body></html>
