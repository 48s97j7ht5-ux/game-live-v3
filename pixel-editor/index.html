<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Lab 400</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#111}body{overflow:hidden}</style></head><body><iframe id="lab" src="./pixel-lab-v4.html"></iframe><script>const frame=document.getElementById('lab');frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument,l=d.getElementById('loupe');if(!l)return;function strongGrid(){const cb=d.getElementById('loupeGrid');if(!cb||!cb.checked)return;const s=+d.getElementById('loupeSize').value,ctx=l.getContext('2d');ctx.save();ctx.strokeStyle='rgba(18,18,18,.52)';ctx.lineWidth=.09;for(let i=1;i<s;i++){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,s);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(s,i);ctx.stroke()}const h=Math.floor(s/2);ctx.strokeStyle='rgba(0,255,255,.95)';ctx.lineWidth=.10;ctx.strokeRect(h+.05,h+.05,.9,.9);ctx.restore()}const old=w.updateLoupe;if(typeof old==='function'){w.updateLoupe=function(...a){const r=old.apply(this,a);strongGrid();return r}}['loupeGrid','loupeSize'].forEach(id=>{const el=d.getElementById(id);if(el)el.addEventListener('change',()=>setTimeout(strongGrid,0))});l.addEventListener('pointerup',()=>setTimeout(strongGrid,0));setTimeout(()=>{if(typeof w.updateLoupe==='function')w.updateLoupe();else strongGrid()},50)};</script></body></html>
