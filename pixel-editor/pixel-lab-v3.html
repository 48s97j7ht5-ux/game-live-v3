<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pixel Lab 400 V3</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}.bar{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#181818;border-bottom:1px solid #333}button,label{background:#292d36;color:#eee;border:1px solid #454b58;border-radius:8px;padding:8px 10px;font-size:14px}button.active{outline:2px solid #fff}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px;padding:10px}.stage{overflow:auto;max-height:calc(100vh - 75px);background:#181818;border:1px solid #333;border-radius:10px;padding:10px}.board{position:relative;margin:auto;width:max-content;touch-action:pan-x pan-y}.board canvas{position:absolute;left:0;top:0;image-rendering:pixelated}.board #grid,.board #overlay,.board #ref{pointer-events:none}.side{background:#181818;border:1px solid #333;border-radius:10px;padding:10px}.card{border:1px solid #333;border-radius:9px;padding:9px;margin:8px 0}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.small{font-size:12px;color:#aaa}.status{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#9fe;background:#111;padding:8px;border-radius:8px}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.sw{aspect-ratio:1;padding:0;border-radius:4px}#loupe{width:315px;height:315px;image-rendering:pixelated;border:2px solid #666;background:#111;touch-action:none}.nav{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center}.blank{visibility:hidden}@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{order:-1}.stage{max-height:none}#loupe{width:min(86vw,315px);height:min(86vw,315px)}}</style></head><body><div class="bar"><label>Спрайт <input id="spriteFile" type="file" accept="image/*"></label><label>Референс <input id="refFile" type="file" accept="image/*"></label><button id="loadKat">Kat V1.1</button><button id="undo">↶ Undo</button><button id="export">PNG 135×400</button></div><div class="wrap"><div class="stage"><div class="board" id="board"><canvas id="ref"></canvas><canvas id="paint"></canvas><canvas id="overlay"></canvas><canvas id="grid"></canvas></div></div><aside class="side"><b>Pixel Lab 400 V3</b><div class="small">Основной холст только для навигации. Рисование и стирание — исключительно в лупе.</div><div class="card"><div class="row">Главный zoom <input id="zoom" type="range" min="1" max="6" value="2"><b id="zoomVal">2×</b></div><div class="row">Ref <input id="refOpacity" type="range" min="0" max="100" value="30"><b id="refOpacityVal">30%</b></div><label><input id="showGrid" type="checkbox"> сетка</label></div><div class="card"><div class="row"><b>🔬 Лупа-редактор</b><span id="coord">x67 y200</span></div><div class="row"><button id="pencil" class="active">✏️ Pixel</button><button id="eraser">⌫ Erase</button><button id="picker">🎯 Pick</button></div><div class="row"><label>Окно <select id="loupeSize"><option>11</option><option selected>15</option><option>21</option></select></label><label><input id="loupeGrid" type="checkbox" checked> grid</label><label><input id="tapOnly" type="checkbox" checked> tap-only</label></div><div style="text-align:center;overflow:auto"><canvas id="loupe" width="15" height="15"></canvas></div><div class="nav"><span class="blank">.</span><button data-move="0,-1">↑</button><span class="blank">.</span><button data-move="-1,0">←</button><button id="centerBtn">◎</button><button data-move="1,0">→</button><span class="blank">.</span><button data-move="0,1">↓</button><span class="blank">.</span></div></div><div class="card"><b>Палитра</b><div id="palette" class="palette"></div><div class="row"><input id="customColor" type="color" value="#090404"><button id="useCustom">Взять</button></div></div><div class="card"><div class="row"><button id="audit">Audit</button><button id="snapshot">Snapshot</button><button id="restoreSnap">Restore</button></div><div id="status" class="status">Тапни по персонажу → редактируй в лупе.</div></div><div class="card"><b>Обучение автоматики</b><div class="small">Сохраняем before→after участка лупы.</div><div class="row"><button id="markBefore">BEFORE</button><button id="recordAfter">AFTER</button><button id="exportTraining">training.json</button></div><div id="trainingStatus" class="small">0 примеров</div></div></aside></div><script>const W=135,H=400,$=id=>document.getElementById(id),paint=$('paint'),ref=$('ref'),overlay=$('overlay'),grid=$('grid'),pc=paint.getContext('2d',{willReadFrequently:true}),rc=ref.getContext('2d'),oc=overlay.getContext('2d'),gc=grid.getContext('2d');[paint,ref,overlay,grid].forEach(c=>{c.width=W;c.height=H});[pc,rc,oc,gc].forEach(c=>c.imageSmoothingEnabled=false);let cx=67,cy=200,tool='pencil',color='#090404',undo=[],snap=null,beforePatch=null,training=[],loupeDrawing=false,palette=['#090404','#140f11','#2b1e1f','#4d302b','#68443a','#865443','#ad765c','#bd8268','#cb906f','#e6a680','#f4b991','#fcc69d','#ffd7b5','#f5e2d5','#ffffff','#76504a','#a06454','#c47e65','#d8a37c','#eec297','#4b2d29','#704438','#9a5c48','#f5a177'];function saveUndo(){undo.push(pc.getImageData(0,0,W,H));if(undo.length>40)undo.shift()}function setZoom(z){$('board').style.width=W*z+'px';$('board').style.height=H*z+'px';[paint,ref,overlay,grid].forEach(c=>{c.style.width=W*z+'px';c.style.height=H*z+'px'});$('zoomVal').textContent=z+'×';drawGrid(z)}function drawGrid(z){gc.clearRect(0,0,W,H);if(!$('showGrid').checked)return;gc.strokeStyle='rgba(255,255,255,.12)';gc.lineWidth=1/z;for(let x=0;x<=W;x++){gc.beginPath();gc.moveTo(x,0);gc.lineTo(x,H);gc.stroke()}for(let y=0;y<=H;y++){gc.beginPath();gc.moveTo(0,y);gc.lineTo(W,y);gc.stroke()}}function pointMain(e){const r=paint.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),y:Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height)))}}function clamp(){const s=+$('loupeSize').value,h=Math.floor(s/2);cx=Math.max(h,Math.min(W-1-h,cx));cy=Math.max(h,Math.min(H-1-h,cy))}function drawOverlay(){oc.clearRect(0,0,W,H);const s=+$('loupeSize').value,h=Math.floor(s/2);oc.strokeStyle='rgba(0,220,255,.95)';oc.lineWidth=1;oc.strokeRect(cx-h-.5,cy-h-.5,s+1,s+1);oc.fillStyle='rgba(255,255,255,.85)';oc.fillRect(cx,cy,1,1)}function updateLoupe(){clamp();drawOverlay();$('coord').textContent=`x${cx} y${cy}`;const s=+$('loupeSize').value,l=$('loupe');l.width=s;l.height=s;const lc=l.getContext('2d');lc.imageSmoothingEnabled=false;const h=Math.floor(s/2);lc.clearRect(0,0,s,s);lc.drawImage(paint,cx-h,cy-h,s,s,0,0,s,s);if($('loupeGrid').checked){lc.strokeStyle='rgba(255,255,255,.28)';lc.lineWidth=.035;for(let i=0;i<=s;i++){lc.beginPath();lc.moveTo(i,0);lc.lineTo(i,s);lc.stroke();lc.beginPath();lc.moveTo(0,i);lc.lineTo(s,i);lc.stroke()}}lc.strokeStyle='cyan';lc.lineWidth=.08;lc.strokeRect(h+.05,h+.05,.9,.9)}function renderPalette(){const b=$('palette');b.innerHTML='';palette.forEach(c=>{const x=document.createElement('button');x.className='sw';x.style.background=c;x.onclick=()=>{color=c;activate('pencil')};b.appendChild(x)})}function activate(t){tool=t;['pencil','eraser','picker'].forEach(id=>$(id).classList.toggle('active',id===t))}function localToSource(e){const l=$('loupe'),r=l.getBoundingClientRect(),s=+$('loupeSize').value,h=Math.floor(s/2),lx=Math.max(0,Math.min(s-1,Math.floor((e.clientX-r.left)*s/r.width))),ly=Math.max(0,Math.min(s-1,Math.floor((e.clientY-r.top)*s/r.height)));return{x:cx-h+lx,y:cy-h+ly}}function editLoupe(e,first=false){const{x,y}=localToSource(e);if(first&&tool!=='picker')saveUndo();if(tool==='picker'){const d=pc.getImageData(x,y,1,1).data;if(d[3]){color='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');$('customColor').value=color;activate('pencil')}return}if(tool==='eraser')pc.clearRect(x,y,1,1);else{pc.fillStyle=color;pc.fillRect(x,y,1,1)}updateLoupe()}paint.onpointerdown=e=>{e.preventDefault();const p=pointMain(e);cx=p.x;cy=p.y;updateLoupe()};$('loupe').onpointerdown=e=>{e.preventDefault();loupeDrawing=true;$('loupe').setPointerCapture(e.pointerId);editLoupe(e,true)};$('loupe').onpointermove=e=>{if(loupeDrawing&&!$('tapOnly').checked)editLoupe(e,false)};$('loupe').onpointerup=()=>loupeDrawing=false;$('loupe').onpointercancel=()=>loupeDrawing=false;document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const[dx,dy]=b.dataset.move.split(',').map(Number);cx+=dx;cy+=dy;updateLoupe()});$('centerBtn').onclick=updateLoupe;$('pencil').onclick=()=>activate('pencil');$('eraser').onclick=()=>activate('eraser');$('picker').onclick=()=>activate('picker');$('loupeSize').onchange=updateLoupe;$('loupeGrid').onchange=updateLoupe;$('zoom').oninput=e=>setZoom(+e.target.value);$('showGrid').onchange=()=>drawGrid(+$('zoom').value);$('refOpacity').oninput=e=>{ref.style.opacity=e.target.value/100;$('refOpacityVal').textContent=e.target.value+'%'};$('undo').onclick=()=>{const x=undo.pop();if(x){pc.putImageData(x,0,0);updateLoupe()}};$('export').onclick=()=>{const a=document.createElement('a');a.download='kat-pixel-135x400.png';a.href=paint.toDataURL('image/png');a.click()};function loadFile(f,ctx,fit=false){if(!f)return;const im=new Image();im.onload=()=>{if(ctx===pc)saveUndo();ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;if(fit){const s=Math.min(W/im.width,H/im.height),dw=Math.round(im.width*s),dh=Math.round(im.height*s);ctx.drawImage(im,Math.round((W-dw)/2),Math.round((H-dh)/2),dw,dh)}else ctx.drawImage(im,0,0,W,H);URL.revokeObjectURL(im.src);updateLoupe()};im.src=URL.createObjectURL(f)}$('spriteFile').onchange=e=>loadFile(e.target.files[0],pc);$('refFile').onchange=e=>loadFile(e.target.files[0],rc,true);async function loadKat(){try{const txt=await(await fetch('./assets/kat-v1_1.b64.txt?v=3')).text(),raw=atob(txt.trim()),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'})),im=new Image();im.onload=()=>{saveUndo();pc.clearRect(0,0,W,H);pc.drawImage(im,0,0,W,H);URL.revokeObjectURL(url);updateLoupe();$('status').textContent='Kat V1.1 loaded · основной холст защищён'};im.src=url}catch(e){$('status').textContent='Kat load error: '+e.message}}$('loadKat').onclick=loadKat;$('useCustom').onclick=()=>{color=$('customColor').value;activate('pencil')};$('audit').onclick=()=>{const d=pc.getImageData(0,0,W,H).data,colors=new Set();let semi=0,count=0;for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;count++;if(d[i+3]!==255)semi++;colors.add(`${d[i]},${d[i+1]},${d[i+2]}`)}$('status').textContent=`Pixel Audit\npixels: ${count}\ncolors: ${colors.size}\nsemi-alpha: ${semi}`};$('snapshot').onclick=()=>{snap=pc.getImageData(0,0,W,H);$('status').textContent='Snapshot сохранён'};$('restoreSnap').onclick=()=>{if(snap){saveUndo();pc.putImageData(snap,0,0);updateLoupe()}};function patch(){const s=+$('loupeSize').value,h=Math.floor(s/2),x=cx-h,y=cy-h;return{x,y,w:s,h:s,data:Array.from(pc.getImageData(x,y,s,s).data)}}$('markBefore').onclick=()=>{beforePatch=patch();$('trainingStatus').textContent=`BEFORE · ${training.length} примеров`};$('recordAfter').onclick=()=>{if(!beforePatch){$('trainingStatus').textContent='Сначала BEFORE';return}training.push({kind:'loupe_edit',center:{x:cx,y:cy},before:beforePatch,after:patch(),timestamp:new Date().toISOString()});beforePatch=null;$('trainingStatus').textContent=`${training.length} примеров`};$('exportTraining').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'pixel-lab/training-v1',canvas:{w:W,h:H},examples:training},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pixel-lab-training.json';a.click()};renderPalette();setZoom(2);ref.style.opacity=.3;updateLoupe();if(new URLSearchParams(location.search).get('kat')==='1')loadKat();</script></body></html>
